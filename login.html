<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign In - RadiantWaves AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/main.css">
</head>
<body>
<div class="auth-page">
<div class="auth-card glass">
<div class="auth-header">
<div class="auth-logo">&#127754;</div>
<h1 class="auth-title">Welcome back</h1>
<p class="auth-subtitle">Sign in to continue to RadiantWaves AI</p>
</div>
<form class="auth-form" id="login-form">
<div class="auth-form-group">
<label class="auth-form-label" for="email">Email address</label>
<input type="email" id="email" class="input" placeholder="you@example.com" required autocomplete="email">
</div>
<div class="auth-form-group">
<label class="auth-form-label" for="password">Password</label>
<input type="password" id="password" class="input" placeholder="••••••••" required autocomplete="current-password">
</div>
<button type="submit" class="btn btn-primary auth-submit"><span>&#128272;</span> Sign In</button>
</form>
<div class="auth-divider">or</div>
<button class="btn btn-secondary" style="width:100%;" onclick="Auth.signInWithOAuth('google').catch(e => Utils.toast(e.message, 'error'))"><span>&#128269;</span> Continue with Google</button>
<div class="auth-footer">Don't have an account? <a href="register.html">Create one</a></div>
</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/config.js"></script>
<script src="js/utils.js"></script>
<script src="js/db.js"></script>
<script src="js/auth.js"></script>
<script src="js/app.js"></script>
</body>
</html>
